name: activity graph

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch graphs
        run: |
          mkdir -p assets
          BASE="https://github-readme-activity-graph.vercel.app/graph?username=xbaox&theme=github-compact&bg_color=00000000&hide_border=true"
          curl -sf "$BASE&line=1a7f37&point=1a7f37&color=57606a" -o assets/activity.svg
          curl -sf "$BASE&line=3fb950&point=3fb950&color=8b949e" -o assets/activity-dark.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "update activity graph"
          git push
